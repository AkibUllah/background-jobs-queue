[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobq"
version = "0.1.0"
description = "Redis-backed background job system: priorities, delays, cron schedules, retries, unique jobs, dependencies, dead letters, stalled-job recovery, plus a FastAPI dashboard API and React UI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "redis>=5.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.26",
  "fakeredis[lua]>=2.21",
  "ruff>=0.4",
]

[project.scripts]
jobq = "jobq.cli:main"

[project.urls]
Homepage = "https://github.com/AkibUllah/background-jobs-queue"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "bench", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["jobq"]
